name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publishing:
        description: What Central does once the bundle validates
        required: true
        default: USER_MANAGED
        type: choice
        options: [USER_MANAGED, AUTOMATIC]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The gate runs again here rather than trusting the CI run on the
  # commit. A tag can point at anything, and a release is the one
  # thing that cannot be taken back.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and document
        run: ./gradlew build --no-daemon

      - name: Test on the declared floor
        run: |
          ./gradlew test --no-daemon \
            -Dorg.gradle.java.installations.auto-detect=true \
            -Ptest.jvm=17

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # A tag that disagrees with the build would publish a version
      # nobody asked for, under a number Maven Central never releases
      # again. Refuse before anything is signed.
      - name: Check the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          built=$(./gradlew -q --no-daemon printVersion)
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$built" != "$tagged" ]; then
            echo "tag $GITHUB_REF_NAME carries $tagged, the build says $built"
            exit 1
          fi
          echo "tag and build agree on $built"

      - name: Build and sign the deployment bundle
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew centralBundle --no-daemon

      # Signing is skipped when no key reaches the build, and an
      # unsigned bundle fails validation only after it has been
      # uploaded. Catch it here, where the failure names the cause.
      - name: Check every artifact carries a signature
        run: |
          bundle=$(ls build/central/central-bundle-*.zip)
          signed=$(unzip -l "$bundle" | grep -c '\.asc$' || true)
          if [ "$signed" -lt 10 ]; then
            echo "$bundle carries $signed signatures, expected at least 10"
            echo "the SIGNING_KEY and SIGNING_PASSWORD secrets are what produce them"
            exit 1
          fi
          echo "$signed signatures present"

      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle
          path: build/central/central-bundle-*.zip

  # Gated on an environment, so uploading needs whatever approval that
  # environment asks for. USER_MANAGED by default: Central validates
  # the bundle and waits for a person to release it.
  central:
    needs: bundle
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: central-bundle
          path: bundle/

      - name: Upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          PUBLISHING: ${{ inputs.publishing || 'USER_MANAGED' }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)
          archive=$(ls bundle/central-bundle-*.zip)
          name=$(basename "$archive" .zip)

          deployment=$(curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$archive" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=$name&publishingType=$PUBLISHING")

          echo "deployment $deployment"
          echo "deployment=$deployment" >> "$GITHUB_ENV"

      # An upload that validates is the only upload worth reporting as
      # a success. Without this the job goes green on a bundle Central
      # is about to reject.
      - name: Wait for validation
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)

          for attempt in $(seq 1 40); do
            body=$(curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer $token" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment")
            state=$(printf '%s' "$body" | python3 -c \
              'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))')
            echo "attempt $attempt: $state"

            case "$state" in
              VALIDATED|PUBLISHING|PUBLISHED)
                echo "$body"
                exit 0
                ;;
              FAILED)
                echo "$body"
                exit 1
                ;;
            esac
            sleep 15
          done

          echo "still $state after 10 minutes; check the Central Portal"
          exit 1
