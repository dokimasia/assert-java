name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 23 is the floor for building, because Markdown doc comments
        # need that javadoc. The artifact targets 17 either way, and
        # the run-on job below tests it there.
        java: ["23", "25"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build, test and document
        run: ./gradlew build --no-daemon

  # The artifact says it runs on Java 17. Compiling against the 17 API
  # is not the same as running there, so run the tests on a real 17.
  run-on-the-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            25

      - uses: gradle/actions/setup-gradle@v6

      - name: Test on the declared floor
        run: |
          ./gradlew test --no-daemon \
            -Dorg.gradle.java.installations.auto-detect=true \
            -Ptest.jvm=17

  # A published jar that does not resolve is still broken, whatever the
  # build said.
  consume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to a local repository and resolve from it
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          mkdir -p /tmp/consumer && cd /tmp/consumer
          cat > build.gradle.kts <<'EOF'
          plugins { java }
          repositories { mavenLocal(); mavenCentral() }
          dependencies { implementation("dev.dokimi:assert-core:0.1.0") }
          EOF
          cat > settings.gradle.kts <<'EOF'
          rootProject.name = "consumer"
          EOF
          mkdir -p src/main/java
          cat > src/main/java/Consume.java <<'EOF'
          import dev.dokimi.assertion.Check;
          import dev.dokimi.assertion.Recorder;

          public class Consume {
            public static void main(String[] args) {
              Recorder seat = new Recorder();
              Check.equal(seat, 1, 2, "the package works");
              if (!seat.failed()) {
                throw new IllegalStateException("the assertion reported nothing");
              }
              System.out.println("resolved and ran: " + seat.message());
            }
          }
          EOF
          gradle --no-daemon -q build
          echo "the published artifact resolves and compiles"

  # The vendored definition is what this library is held to, and a copy
  # nobody checked is a copy that can drift. This fails on a copy that
  # does not match the manifest beside it, and reports without failing
  # when the definition has moved on: lagging is allowed, not knowing
  # is not.
  # The vendored definition is what this library is held to. A copy that
  # does not match the manifest beside it fails, always. A copy that
  # differs from upstream only fails when this change is the one that
  # touched it: falling behind is allowed and is tracked by an issue,
  # but committing a copy nobody else has is not.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did this change touch the vendored copy?
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "strict=" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- assert-core/src/test/resources/dev/dokimi/assertion/conformance/spec | grep -q .; then
            echo "strict=--strict" >> "$GITHUB_OUTPUT"
          else
            echo "strict=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the vendored definition
        run: ./tools/spec-check.sh assert-core/src/test/resources/dev/dokimi/assertion/conformance/spec ${{ steps.touched.outputs.strict }}
