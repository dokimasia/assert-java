# The copy of the definition of assert-spec, which spec sync writes and spec check verifies. The
# conformance tests of assert-core read the copy as test resources.
implements:
  - definition: dokimasia/assert-spec
    path: assert-core/src/test/resources/dev/dokimi/assertion/conformance
    languages: [java]
    test: [./gradlew, test]
